<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - StayConnect</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="header__logo">
        <img src="img/SC.png" alt="StayConnect Logo"/>
      </a>
      <nav>
        <ul class="header__menu">
          <li class="header__menu-item"><a href="index.html"><i class="fas fa-home"></i> Inicio</a></li>
          <li class="header__menu-item"><a href="productos.html"><i class="fas fa-box-open"></i> Productos</a></li>
          <li class="header__menu-item"><a href="carrito.html"><i class="fas fa-shopping-cart"></i> Carrito</a></li>
          <li class="header__menu-item"><a id="user-nav" href="login.html"><i class="fas fa-user"></i> Login</a></li>
        </ul>
      </nav>
    </header>

    <main class="cart-container">
      <div class="cart-content">
        <header class="cart-header">
          <h2><i class="fas fa-shopping-cart"></i> Tu Carrito</h2>
        </header>
        
        <div id="carrito-container" class="cart-items"></div>
        
        <div class="cart-summary">
          <div id="carrito-total" class="cart-total"></div>
          <div class="cart-actions">
            <button id="vaciar-carrito" class="btn btn-secondary">
              <i class="fas fa-trash"></i>
              Vaciar carrito
            </button>
            <button id="realizar-pedido" class="btn btn-primary">
              <i class="fas fa-credit-card"></i>
              Realizar pedido
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer footer--with-map">
      <div class="footer--map-area">
        <div id="stay-map" style="height:100%; width:100%; border-radius:8px; overflow:hidden;"></div>
      </div>
      <div class="footer--info">
        <h4>StayConnect</h4>
        <p class="footer__text">&copy; 2025 StayConnect</p>
        <div class="footer--contact">
          <div><span class="label">Dirección:</span> C. Alcalá, 50, 28014 Madrid</div><br>
          <div><span class="label">Teléfono:</span> +34 912 345 678</div>
        </div>
        <div class="footer--links">
          <a href="productos.html">Productos</a>
          <a href="carrito.html">Carrito</a>
          <a href="perfil.html">Mi cuenta</a>
          <a href="contacto.html">Contacto</a>
        </div>
        <div class="footer--socials">
          <a href="#" aria-label="facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="#" aria-label="twitter"><i class="fab fa-twitter"></i></a>
          <a href="#" aria-label="instagram"><i class="fab fa-instagram"></i></a>
        </div>
      </div>
    </footer>
    <script type="module" src="js/scripts/carrito.js"></script>
  </body>
</html>
