<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle de producto - StayConnect</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="header__logo"><img src="img/SC.png" alt="Logo"/></a>
      <nav>
        <ul class="header__menu">
          <li class="header__menu-item"><a href="index.html"><i class="fas fa-home"></i> Inicio</a></li>
          <li class="header__menu-item"><a href="productos.html"><i class="fas fa-box-open"></i> Productos</a></li>
          <li class="header__menu-item"><a href="carrito.html"><i class="fas fa-shopping-cart"></i> Carrito</a></li>
          <li class="header__menu-item"><a id="user-nav" href="login.html"><i class="fas fa-user"></i> Login</a></li>
        </ul>
      </nav>
    </header>

    <main class="product-detail-container">
      <div class="product-detail-main">
        <div class="detail-image">
          <img id="variant-image" src="" alt="Imagen de variante" />
        </div>
        <div class="detail-info">
          <section id="detalle-prod"></section>
          <div class="variant-selector">
            <label for="variant-select"><strong>Elegir Variante:</strong></label>
            <select id="variant-select"></select>
          </div>
          <p id="precio"></p>
          <button id="addcarrito" class="btn btn-primary" disabled>Añadir al carrito</button>
        </div>
      </div>

      <section class="reviews-section">
        <h3><i class="fas fa-star"></i> Reseñas</h3>
        <div id="review-average" class="review-average"></div>
        <div id="reviews-list"></div>

        <form id="review-form" class="review-form">
          <h4>Escribe tu reseña</h4>
          <label for="score">Puntuación:</label>
          <select id="score" required>
            <option value="">Selecciona</option>
            <option value="1">1 ★</option>
            <option value="2">2 ★★</option>
            <option value="3">3 ★★★</option>
            <option value="4">4 ★★★★</option>
            <option value="5">5 ★★★★★</option>
          </select>
          <label for="comment">Comentario:</label>
          <textarea id="comment" rows="3" required></textarea>
          <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
      </section>
    </main>

    <footer class="footer footer--with-map">
      <div class="footer--map-area">
        <div id="stay-map" style="height:100%; width:100%; border-radius:8px; overflow:hidden;"></div>
      </div>
      <div class="footer--info">
        <h4>StayConnect</h4>
        <p class="footer__text">&copy; 2025 StayConnect</p>
        <div class="footer--contact">
          <div><span class="label">Dirección:</span> C. Alcalá, 50, 28014 Madrid</div>
          <div><span class="label">Teléfono:</span> +34 912 345 678</div>
        </div>
        <div class="footer--links">
          <a href="productos.html">Productos</a>
          <a href="carrito.html">Carrito</a>
          <a href="perfil.html">Mi cuenta</a>
          <a href="contacto.html">Contacto</a>
        </div>
        <div class="footer--socials">
          <a href="#" aria-label="facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="#" aria-label="twitter"><i class="fab fa-twitter"></i></a>
          <a href="#" aria-label="instagram"><i class="fab fa-instagram"></i></a>
        </div>
      </div>
    </footer>

    <script type="module" src="js/scripts/detalle_producto.js"></script>
  </body>
</html>
